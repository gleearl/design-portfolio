<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1180" width="2400" height="1180">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#32404F" stroke-opacity=".06" stroke-width="2"/></pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#14161C" flood-opacity=".10"/></filter>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#32404F" fill-opacity=".07"/></pattern>
    <style>
      .sans { font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif; }
      .serif { font-family: 'Newsreader', Georgia, 'Times New Roman', serif; }
      .ln { fill: #32404F; fill-opacity: .13; }
      .lnh { fill: #32404F; fill-opacity: .3; }
      .soft { fill: #32404F; fill-opacity: .05; }
    </style>
  </defs>
  <rect width="2400" height="1180" fill="#F3F4F2"/>
  <rect width="2400" height="1180" fill="url(#grid)"/>

  <!-- Quotes, labelled by role only -->
  <g class="sans">
    <g filter="url(#sh)">
      <rect x="120" y="110" width="640" height="190" rx="28" fill="#fff"/>
      <rect x="880" y="110" width="640" height="190" rx="28" fill="#fff"/>
      <rect x="1640" y="110" width="640" height="190" rx="28" fill="#fff"/>
    </g>
    <text class="serif" x="170" y="200" font-size="44" fill="#32404F">“A combination of both</text>
    <text class="serif" x="170" y="252" font-size="44" fill="#32404F">would be great.”</text>
    <text class="serif" x="930" y="200" font-size="44" fill="#32404F">“It looks like an</text>
    <text class="serif" x="930" y="252" font-size="44" fill="#32404F">ad banner.”</text>
    <text class="serif" x="1690" y="200" font-size="44" fill="#32404F">“We can see directly…</text>
    <text class="serif" x="1690" y="252" font-size="44" fill="#32404F">better than the last.”</text>
    <text x="120" y="350" font-size="26" letter-spacing="2" fill="#6B7A3A">MEDICAL WRITER</text>
    <text x="880" y="350" font-size="26" letter-spacing="2" fill="#6B7A3A">CME LEAD</text>
    <text x="1640" y="350" font-size="26" letter-spacing="2" fill="#6B7A3A">PHYSICIAN</text>
  </g>

  <!-- Three concept wireframes: search in the top bar, in a banner, in the content -->
  <g filter="url(#sh)">
    <rect x="120" y="420" width="640" height="660" rx="28" fill="#fff"/>
    <rect x="880" y="420" width="640" height="660" rx="28" fill="#fff"/>
    <rect x="1640" y="420" width="640" height="660" rx="28" fill="#fff"/>
  </g>

  <!-- A: top bar -->
  <rect x="160" y="460" width="560" height="56" rx="12" fill="#32404F"/>
  <rect x="182" y="476" width="24" height="24" rx="6" fill="#fff" fill-opacity=".9"/>
  <rect x="224" y="484" width="56" height="8" rx="4" fill="#fff" fill-opacity=".5"/>
  <rect x="296" y="484" width="56" height="8" rx="4" fill="#fff" fill-opacity=".5"/>
  <rect x="478" y="472" width="222" height="32" rx="16" fill="#fff"/>
  <rect x="472" y="466" width="234" height="44" rx="22" fill="none" stroke="#E65F2E" stroke-width="4"/>
  <text class="sans" x="496" y="495" font-size="20" fill="#32404F" fill-opacity=".7">Search</text>
  <rect x="160" y="540" width="560" height="70" rx="10" fill="url(#hatch)" stroke="#32404F" stroke-opacity=".12" stroke-width="2"/>
  <text class="sans" x="440" y="583" font-size="22" text-anchor="middle" fill="#32404F" fill-opacity=".6">Ad</text>
  <rect x="160" y="634" width="560" height="110" rx="12" class="ln"/>
  <rect x="160" y="772" width="360" height="22" rx="11" class="lnh"/>
  <rect x="160" y="814" width="560" height="14" rx="7" class="ln"/>
  <rect x="160" y="844" width="560" height="14" rx="7" class="ln"/>
  <rect x="160" y="874" width="380" height="14" rx="7" class="ln"/>
  <rect x="160" y="918" width="560" height="14" rx="7" class="ln"/>
  <rect x="160" y="948" width="300" height="14" rx="7" class="ln"/>
  <text class="sans" x="160" y="1040" font-size="26" letter-spacing="2" fill="#32404F" fill-opacity=".72">A · TOP BAR</text>

  <!-- B: banner -->
  <rect x="920" y="460" width="560" height="56" rx="12" fill="#32404F"/>
  <rect x="942" y="476" width="24" height="24" rx="6" fill="#fff" fill-opacity=".9"/>
  <rect x="984" y="484" width="56" height="8" rx="4" fill="#fff" fill-opacity=".5"/>
  <rect x="1056" y="484" width="56" height="8" rx="4" fill="#fff" fill-opacity=".5"/>
  <rect x="920" y="540" width="560" height="200" rx="14" class="ln"/>
  <rect x="960" y="612" width="480" height="56" rx="28" fill="#fff"/>
  <text class="sans" x="992" y="648" font-size="22" fill="#32404F" fill-opacity=".7">Search</text>
  <rect x="920" y="772" width="360" height="22" rx="11" class="lnh"/>
  <rect x="920" y="814" width="560" height="14" rx="7" class="ln"/>
  <rect x="920" y="844" width="560" height="14" rx="7" class="ln"/>
  <rect x="920" y="874" width="380" height="14" rx="7" class="ln"/>
  <rect x="920" y="918" width="560" height="14" rx="7" class="ln"/>
  <rect x="920" y="948" width="300" height="14" rx="7" class="ln"/>
  <text class="sans" x="920" y="1040" font-size="26" letter-spacing="2" fill="#32404F" fill-opacity=".72">B · BANNER</text>

  <!-- C: in the content, shipped -->
  <rect x="1680" y="460" width="560" height="56" rx="12" fill="#32404F"/>
  <rect x="1702" y="476" width="24" height="24" rx="6" fill="#fff" fill-opacity=".9"/>
  <rect x="1744" y="484" width="56" height="8" rx="4" fill="#fff" fill-opacity=".5"/>
  <rect x="1816" y="484" width="56" height="8" rx="4" fill="#fff" fill-opacity=".5"/>
  <rect x="1680" y="540" width="560" height="110" rx="12" class="ln"/>
  <rect x="1680" y="678" width="360" height="22" rx="11" class="lnh"/>
  <rect x="1680" y="724" width="560" height="58" rx="12" fill="#fff" stroke="#32404F" stroke-opacity=".2" stroke-width="2"/>
  <rect x="1672" y="716" width="576" height="74" rx="18" fill="none" stroke="#E65F2E" stroke-width="4"/>
  <text class="sans" x="1706" y="761" font-size="24" fill="#32404F">Search diseases</text>
  <circle cx="2200" cy="751" r="11" fill="none" stroke="#32404F" stroke-width="3"/>
  <path d="M2208 759l9 9" stroke="#32404F" stroke-width="3" stroke-linecap="round"/>
  <rect x="1680" y="814" width="560" height="14" rx="7" class="ln"/>
  <rect x="1680" y="844" width="560" height="14" rx="7" class="ln"/>
  <rect x="1680" y="874" width="380" height="14" rx="7" class="ln"/>
  <rect x="1680" y="918" width="560" height="14" rx="7" class="ln"/>
  <rect x="1680" y="948" width="300" height="14" rx="7" class="ln"/>
  <text class="sans" x="1680" y="1040" font-size="26" letter-spacing="2" fill="#32404F" fill-opacity=".72">C · IN THE CONTENT</text>
  <rect x="2060" y="1010" width="180" height="44" rx="22" fill="#32404F"/>
  <path d="M2088 1032l8 8 14-16" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="sans" x="2120" y="1041" font-size="22" letter-spacing="1.5" fill="#fff">SHIPPED</text>
</svg>
