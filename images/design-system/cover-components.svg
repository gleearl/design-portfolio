<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1180" role="img" aria-label="Bird's-eye view of MIMS web app design system components: navigation bar, search with AI suggestions, specialty chips, breadcrumb, Noto Sans type card, brand red ramp, a semantic token, a filter dropdown and button states">
  <title>MIMS web app design system</title>
  <!-- Direction: developer.apple.com/design. Real components from the system on a pale grid.
       Layout: an equal 100px margin on every side. Left column x 100-1240, right column x 1340-2300, rows end at y 1080. -->
  <defs>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0 H0 V120" fill="none" stroke="#1B1C1D" stroke-opacity=".05" stroke-width="2"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#F3F2F1" stop-opacity="0"/>
      <stop offset="1" stop-color="#E4E2E0" stop-opacity="1"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#1B1C1D" flood-opacity=".11"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B1C1D" flood-opacity=".07"/>
    </filter>
    <filter id="btn" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8A1015" flood-opacity=".13"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B1C1D" flood-opacity=".07"/>
    </filter>
  </defs>
  <style>
    text { font-family: "Noto Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .float { animation: float 7s ease-in-out infinite; }
    .f2 { animation-delay: -1.4s; } .f3 { animation-delay: -2.8s; } .f4 { animation-delay: -4.2s; } .f5 { animation-delay: -5.6s; }
    .hover { animation: hover 4s ease-in-out infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes float { 0%, 100% { transform: translateY(3px); } 50% { transform: translateY(-3px); } }
    @keyframes hover { 0%, 35%, 100% { fill: #D02126; } 50%, 85% { fill: #A8161B; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .float, .hover, .caret { animation: none; } }
  </style>

  <!-- canvas -->
  <rect width="2400" height="1180" fill="#F3F2F1"/>
  <rect width="2400" height="1180" fill="url(#grid)"/>
  <rect width="2400" height="1180" fill="url(#vignette)"/>

  <!-- construction lines -->
  <g fill="none" stroke="#1B1C1D" stroke-opacity=".09" stroke-width="2">
    <line x1="0" y1="400" x2="2400" y2="400"/>
    <line x1="1290" y1="0" x2="1290" y2="1180"/>
    <circle cx="1560" cy="370" r="300"/>
    <circle cx="420" cy="840" r="250"/>
  </g>

  <!-- LEFT COLUMN (x 100-1240) -->

  <!-- navigation bar -->
  <g class="float f2" filter="url(#lift)">
    <rect x="100" y="100" width="1140" height="110" rx="20" fill="#3B3738"/>
    <g font-size="38" fill="#fff">
      <text x="160" y="168">Home</text>
      <text x="315" y="168">Find Drugs</text>
      <text x="555" y="168">Pill Identifier</text>
      <text x="850" y="168" font-weight="700">Diseases</text>
      <text x="1070" y="168">News</text>
    </g>
    <rect x="850" y="188" width="164" height="6" rx="3" fill="#EC1C24"/>
  </g>

  <!-- search -->
  <g class="float" filter="url(#lift)">
    <rect x="100" y="250" width="1140" height="120" rx="20" fill="#fff" stroke="#F2BCBC" stroke-width="4"/>
    <circle cx="170" cy="306" r="21" fill="none" stroke="#D02126" stroke-width="7"/>
    <line x1="186" y1="322" x2="203" y2="339" stroke="#D02126" stroke-width="7" stroke-linecap="round"/>
    <text x="226" y="325" font-size="42" fill="#8E9196">Search in Disease Guidelines</text>
    <rect class="caret" x="808" y="284" width="4" height="50" fill="#D02126"/>
    <rect x="1014" y="264" width="212" height="92" rx="14" fill="#F2BCBC"/>
    <text x="1120" y="324" text-anchor="middle" font-size="38" font-weight="600" fill="#fff">Search</text>
  </g>

  <!-- AI suggestion row -->
  <g class="float f3" filter="url(#lift)">
    <path d="M118 448 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z" fill="#D02126"/>
    <text x="152" y="480" font-size="36" font-weight="700" fill="#1B1C1D">Powered by AI</text>
    <text x="418" y="480" font-size="36" fill="#5F6266">Try searching for:</text>
    <rect x="830" y="432" width="410" height="76" rx="12" fill="#fff" stroke="#E2E2E4" stroke-width="2.5"/>
    <text x="1035" y="482" text-anchor="middle" font-size="35" fill="#1B1C1D">early symptoms of DM</text>
  </g>

  <!-- specialty chips -->
  <g class="float f4" filter="url(#btn)">
    <rect x="100" y="570" width="420" height="110" rx="16" fill="#D02126"/>
    <text x="310" y="640" text-anchor="middle" font-size="44" font-weight="600" fill="#fff">Multidisciplinary</text>
    <rect x="552" y="570" width="310" height="110" rx="16" fill="#EDEDEE" stroke="#E2E2E4" stroke-width="2"/>
    <text x="707" y="640" text-anchor="middle" font-size="44" fill="#1B1C1D">Cardiology</text>
    <rect x="894" y="570" width="346" height="110" rx="16" fill="#EDEDEE" stroke="#E2E2E4" stroke-width="2"/>
    <text x="1067" y="640" text-anchor="middle" font-size="44" fill="#1B1C1D">Dermatology</text>
  </g>

  <!-- breadcrumb -->
  <g class="float f5" filter="url(#lift)">
    <rect x="100" y="740" width="800" height="110" rx="55" fill="#fff"/>
    <text x="160" y="809" font-size="40" fill="#5F6266">Home</text>
    <path d="M286 781 l12 14 -12 14" fill="none" stroke="#8E9196" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="326" y="809" font-size="40" fill="#5F6266">Diseases</text>
    <path d="M514 781 l12 14 -12 14" fill="none" stroke="#8E9196" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="554" y="809" font-size="40" font-weight="700" fill="#D02126">Hypertension</text>
  </g>

  <!-- primary + outline buttons -->
  <g class="float f2" filter="url(#btn)">
    <rect class="hover" x="100" y="950" width="540" height="130" rx="18" fill="#D02126"/>
    <text x="370" y="1031" text-anchor="middle" font-size="46" font-weight="600" letter-spacing="-.5" fill="#fff">Sign Up With Email</text>
    <path d="M604 1012 l0 50 l13 -12 l9 21 l10 -4 l-9 -21 l18 0 Z" fill="#1B1C1D" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <rect x="680" y="950" width="300" height="130" rx="18" fill="#fff" stroke="#D02126" stroke-width="3.5"/>
    <text x="830" y="1031" text-anchor="middle" font-size="46" font-weight="600" letter-spacing="-.5" fill="#D02126">Button</text>
  </g>

  <!-- RIGHT COLUMN (x 1340-2300) -->

  <!-- type card -->
  <g class="float f3" filter="url(#lift)">
    <rect x="1340" y="100" width="440" height="540" rx="40" fill="#1B1C1D"/>
    <text x="1392" y="174" class="mono" font-size="26" letter-spacing="3" fill="#F2BCBC">PRIMARY TYPEFACE</text>
    <text x="1392" y="226" font-size="42" font-weight="700" fill="#fff">Noto Sans</text>
    <text x="1384" y="494" font-size="240" font-weight="700" letter-spacing="-8" fill="#fff">Aa</text>
    <line x1="1392" y1="544" x2="1728" y2="544" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    <g font-size="32" fill="#fff">
      <text x="1392" y="598" font-weight="300">Aa</text>
      <text x="1490" y="598" font-weight="400">Aa</text>
      <text x="1588" y="598" font-weight="600">Aa</text>
      <text x="1684" y="598" font-weight="700">Aa</text>
    </g>
  </g>

  <!-- brand red ramp -->
  <g class="float f4" filter="url(#lift)">
    <rect x="1840" y="100" width="460" height="340" rx="36" fill="#fff"/>
    <text x="1886" y="164" class="mono" font-size="26" letter-spacing="3" fill="#D02126">BRAND RED</text>
    <rect x="1886" y="196" width="123" height="200" fill="#D02126"/>
    <rect x="2009" y="196" width="123" height="200" fill="#EC1C24"/>
    <rect x="2132" y="196" width="123" height="200" fill="#F2BCBC"/>
    <g class="mono" font-size="24">
      <text x="1902" y="348" fill="#fff">500</text><text x="1902" y="380" fill="#fff" fill-opacity=".85">#d02126</text>
      <text x="2025" y="348" fill="#fff">400</text><text x="2025" y="380" fill="#fff" fill-opacity=".85">#ec1c24</text>
      <text x="2148" y="348" fill="#1B1C1D">200</text><text x="2148" y="380" fill="#5F6266">#f2bcbc</text>
    </g>
  </g>

  <!-- semantic token -->
  <g class="float f5" filter="url(#lift)">
    <rect x="1840" y="520" width="460" height="120" rx="60" fill="#fff"/>
    <rect x="1880" y="550" width="60" height="60" rx="14" fill="#D02126"/>
    <text x="1966" y="592" class="mono" font-size="30" fill="#1B1C1D">bg/brand</text>
    <text x="2262" y="592" text-anchor="end" class="mono" font-size="26" fill="#8E9196">red/500</text>
  </g>

  <!-- filter dropdown -->
  <g class="float" filter="url(#lift)">
    <rect x="1340" y="740" width="960" height="110" rx="28" fill="#fff"/>
    <text x="1400" y="809" font-size="42" font-weight="700" fill="#1B1C1D">Showing</text>
    <rect x="1610" y="752" width="420" height="86" rx="14" fill="#D02126"/>
    <text x="1820" y="809" text-anchor="middle" font-size="40" font-weight="600" fill="#fff">Multidisciplinary</text>
    <path d="M2070 784 l20 20 20 -20" fill="none" stroke="#D02126" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- hover + disabled states -->
  <g class="float f3" filter="url(#btn)">
    <rect x="1340" y="950" width="300" height="130" rx="18" fill="#A8161B"/>
    <text x="1490" y="1031" text-anchor="middle" font-size="46" font-weight="600" letter-spacing="-.5" fill="#fff">Hover</text>
    <rect x="1680" y="950" width="320" height="130" rx="18" fill="#F2BCBC"/>
    <text x="1840" y="1031" text-anchor="middle" font-size="46" font-weight="600" letter-spacing="-.5" fill="#fff">Disabled</text>
  </g>
</svg>
